{% extends 'base.html' %}

{% block content %}

<div class="container col-4">
    <div class="card mt-4">
        <div class="card-header">
            <h2>Login de usuário</h2>
        </div>
        <div class="card-boy m-auto">
            <!--FORMULARIO-->
            <form action="{{url_for('login')}}" method="POST">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="Insira seu e-mail" class="form-control" required>
                <label>Senha</label>
                <input type="password" name="senha" placeholder="Insira sua senha" class="form-control" required>
                {% if erro %}
                    <div class="alert alert-danger mt-2">{{ erro }}</div>
                {% endif %}
                <!--BOTÂO-->
                <button type="submit" class=" btn btn-danger btn-block">Entrar</button>
            </form>
            <hr>
            <!--LINK PARA SE CADASTRAR-->
            <h6>Não possui uma conta?<a href="{{url_for('cadastro')}}">Cadastre-se</a></h6>
        </div>
    </div>
</div>
{% endblock content %}
